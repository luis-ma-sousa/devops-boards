name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -o addopts="" -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: boards
          POSTGRES_PASSWORD: boards
          POSTGRES_DB: boards_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U boards" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://boards:boards@localhost:5432/boards_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: pytest -o addopts="" -q

  launcher:
    name: launcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      BOARDS_NO_PAUSE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Start with run.sh
        if: runner.os != 'Windows'
        run: ./run.sh --smoke
      - name: Start with run.bat
        if: runner.os == 'Windows'
        shell: cmd
        run: run.bat --smoke
